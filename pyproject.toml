[project]
name = "myelin-backend"
version = "0.1.0"
description = "Myelin backend MVP: deterministic CEO decision-simulation platform for business education"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "fastapi-cli>=0.0.32",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# session-scoped so the session-scoped test_engine fixture's asyncpg connections stay bound
# to the same event loop as the tests that use them (function-scoped loops would cause
# "another operation is in progress" cross-loop errors against the async engine).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
